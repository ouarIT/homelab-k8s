apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: uptime-kuma 
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.9
          ports:
            - containerPort: 3001  # Puerto nativo de la aplicación
          volumeMounts:
            - name: kuma-data-volume
              mountPath: /app/data  # Ruta interna del contenedor donde guarda los datos
      volumes:
        - name: kuma-data-volume
          persistentVolumeClaim:
            claimName: kuma-pvc  # Vinculamos el volumen con nuestro PVC del Paso 2
