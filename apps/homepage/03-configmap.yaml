apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: home
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Ouarit Homelab
  bookmarks.yaml: |
    - Favoritos:
        - GitHub:
            - abbr: GH
              href: https://github.com/ouarIT/homelab-k8s
  services.yaml: |
    - Monitoreo:
        - Uptime Kuma:
            icon: uptime-kuma
            href: https://kuma.ouarit.com/
            widget:
              type: uptimekuma
              url: http://uptime-kuma-service.uptime-kuma:3001
              slug: default 
#   - Mensajería:
#       - Gotify:
#           icon: gotify
#           href: https://gotify.ouarit.com/
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          label: "k3s-cluster"
        nodes:
          show: true
          cpu: true
          memory: true
    - search:
        provider: duckduckgo
        target: _blank
