apiVersion: apps/v1
kind: Deployment
metadata:
  name: ouarit-com-web
  namespace: ouarit-com
  labels:
    app.kubernetes.io/name: ouarit-com-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ouarit-com-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ouarit-com-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html-volume
          configMap:
            name: ouarit-com-html
